services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - jobmatcher

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobfetcher}
      POSTGRES_USER: ${POSTGRES_USER:-jobfetcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jobmatcher

  backend:
    image: ghcr.io/${GHCR_OWNER}/job-fetcher-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobfetcher}
      DATABASE_USERNAME: ${POSTGRES_USER:-jobfetcher}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    expose:
      - "8080"
    volumes:
      - ${RESUME_STORAGE_DIR_HOST:-./data/resumes}:/app/data/resumes
    depends_on:
      postgres:
        condition: service_started
    networks:
      - jobmatcher

  frontend:
    image: ghcr.io/${GHCR_OWNER}/job-fetcher-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - jobmatcher

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  jobmatcher:
