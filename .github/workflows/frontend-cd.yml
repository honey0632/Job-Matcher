# Publishes the frontend container after successful main-branch CI.

name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/job-fetcher-frontend
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish frontend image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_BASE_URL=${{ vars.JOBMATCHER_VITE_API_BASE_URL || 'https://api.jobmatcher.in' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.IMAGE_SHA }}

  deploy:
    name: Deploy frontend
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.JOBMATCHER_PRODUCTION_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jobmatcher_key
          chmod 600 ~/.ssh/jobmatcher_key
          ssh-keyscan -H "${{ secrets.JOBMATCHER_PRODUCTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend container
        env:
          IMAGE_TAG: sha-${{ env.IMAGE_SHA }}
        run: |
          ssh -i ~/.ssh/jobmatcher_key \
            "${{ secrets.JOBMATCHER_PRODUCTION_USER }}@${{ secrets.JOBMATCHER_PRODUCTION_HOST }}" \
            "cd /opt/jobmatcher && IMAGE_TAG=${IMAGE_TAG} docker compose -f compose.production.yaml pull frontend && IMAGE_TAG=${IMAGE_TAG} docker compose -f compose.production.yaml up -d --no-deps frontend"
