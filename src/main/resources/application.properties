spring.application.name=Job Fetcher
spring.config.import=optional:file:.env[.properties]
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobfetcher}
spring.datasource.username=${DATABASE_USERNAME:honey0632}
spring.datasource.password=${DATABASE_PASSWORD:Honey@632}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

app.resume.storage-dir=${RESUME_STORAGE_DIR:./data/resumes}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Select "gemini" for AI scoring or keep "keyword" for local/offline matching.
app.matching.provider=${MATCHING_PROVIDER:keyword}
# Comma-separated approved sources used by POST /api/jobs/search. Each source is
# bounded and fails the search explicitly if its public endpoint is unavailable.
app.job-sources.enabled=${JOB_SOURCES_ENABLED:GOOGLE_CAREERS,AMAZON,WELLS_FARGO,NVIDIA,META,MICROSOFT,APPLE,NETFLIX,UBER,INFOSYS,TCS,WIPRO,ADOBE,SALESFORCE,ATLASSIAN,INTUIT,SERVICENOW,ORACLE,CISCO}
# Gemini credentials are supplied only through the server environment.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-development-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-development-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email